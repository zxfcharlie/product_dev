<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>注册 - Etsy 运营任务管理系统</title>
<link rel="stylesheet" href="/static/style.css?v={{ app_version }}">
</head>
<body class="auth-body">
  <div class="auth-card" id="auth-card">
    <h2>注册账号</h2>
    <div id="err" class="auth-error"></div>
    <input id="display_name" placeholder="姓名" />
    <input id="username" placeholder="用户名" />
    <input id="password" type="password" placeholder="密码" />
    <button onclick="doRegister()">注册</button>
    <p class="auth-switch">已有账号？<a href="/login">去登录</a></p>
    <p class="auth-hint">提示：第一个注册的账号会自动成为管理员并直接可用；其它账号注册后需要等管理员审核通过才能登录。</p>
  </div>
<script>
async function doRegister() {
  const display_name = document.getElementById('display_name').value.trim();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/register', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({display_name, username, password})
  });
  if (res.ok) {
    const j = await res.json();
    if (j.is_approved) {
      window.location.href = '/login';
    } else {
      document.getElementById('auth-card').innerHTML =
        '<h2>注册成功</h2>' +
        '<p class="auth-hint">账号已提交，需要等待管理员审核通过后才能登录，请稍后再来。</p>' +
        '<p class="auth-switch"><a href="/login">去登录页面</a></p>';
    }
  } else {
    const j = await res.json().catch(() => ({detail: '注册失败'}));
    document.getElementById('err').textContent = j.detail || '注册失败';
  }
}
</script>
</body>
</html>
