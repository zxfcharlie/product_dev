<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 - Etsy 运营任务管理系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h2>登录</h2>
    <div id="err" class="auth-error"></div>
    <input id="username" placeholder="用户名" />
    <input id="password" type="password" placeholder="密码" />
    <button onclick="doLogin()">登录</button>
    <p class="auth-switch">还没有账号？<a href="/register">去注册</a></p>
  </div>
<script>
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password})
  });
  if (res.ok) { window.location.href = '/'; }
  else {
    const j = await res.json().catch(() => ({detail: '登录失败'}));
    document.getElementById('err').textContent = j.detail || '登录失败';
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
