services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: etsy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etsy_password}
      POSTGRES_DB: etsy_system
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etsy"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://etsy:${POSTGRES_PASSWORD:-etsy_password}@db:5432/etsy_system
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key}
    ports:
      - "8000:8000"

volumes:
  pgdata:
